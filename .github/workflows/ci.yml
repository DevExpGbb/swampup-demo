name: ci

# Every push and pull request runs the org-governed APM supply-chain audit.
# The gate is a REUSABLE workflow published by zava-agent-config: it installs
# the apm CLI, auto-detects this repo's apm-policy.yml (so `extends: org`
# layers the DevExpGbb org floor), and runs `apm audit --ci --no-drift`.
#
# Beat 9 of the keynote demo: open a pull request that drops the
# secure-baseline pin from apm.yml and this check goes red on
# `required-packages` — the org policy enforced automatically on the PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  apm-audit:
    name: APM audit (supply-chain gate)
    uses: DevExpGbb/zava-agent-config/.github/workflows/apm-audit.yml@v6.3.0
    # Pin the audit CLI to the same apm the demo runs live (0.29.0), which also
    # generated apm.lock.yaml. Keeps CI hashing identical to the committed lock.
    with:
      apm-version: "0.29.0"
